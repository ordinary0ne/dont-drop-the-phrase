<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111416">
<title>Giusto · Quiz</title>
<style>
  :root {
    --bg: #111416; --card: #1b2025; --card2: #232a31; --line: #2f373f;
    --text: #f0f1f3; --muted: #afb5bd; --accent: #e7a3b0; --focus: #f5ce83;
    --ok: #7fd4a0; --okbg: #17352a; --half: #f0c674; --halfbg: #3a3120; --bad: #f19a9a; --badbg: #3d1f22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  header b { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  header span { color: var(--muted); font-size: 14px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .levels { display: grid; gap: 10px; }
  .level { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
    text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .level:hover { border-color: var(--accent); }
  .level strong { display: block; font-size: 18px; }
  .level small { color: var(--muted); font-size: 14px; }
  .badge { font-size: 13px; padding: 3px 9px; border-radius: 99px; background: var(--card2); color: var(--muted); white-space: nowrap; }
  .badge.pass { background: var(--okbg); color: var(--ok); }
  h2 { font-size: 24px; margin: 28px 0 16px; }
  details { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
  summary { cursor: pointer; padding: 10px 0; color: var(--muted); }
  details ul { padding-left: 18px; margin: 0 0 12px; }
  details li { margin: 0 0 10px; }
  details li b { color: var(--accent); font-weight: 600; }
  .bar { height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .q .label { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .q .dish { font-size: 20px; font-weight: 600; }
  .q .phrase { font-size: 18px; }
  .blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); color: var(--accent); text-align: center; }
  .choices { display: grid; gap: 8px; }
  .choice { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice kbd { color: var(--muted); font: inherit; font-size: 14px; min-width: 1em; }
  .choice:disabled { cursor: default; }
  .choice.ok { background: var(--okbg); border-color: var(--ok); }
  .choice.bad { background: var(--badbg); border-color: var(--bad); }
  .slots { display: grid; gap: 8px; }
  .slot { width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .slot::placeholder { color: #868d96; }
  .slot.ok { background: var(--okbg); border-color: var(--ok); }
  .slot.bad { background: var(--badbg); border-color: var(--bad); }
  .slot.half { background: var(--halfbg); border-color: var(--half); }
  .feedback { margin: 14px 0; padding: 12px 14px; border-radius: 10px; background: var(--card2); }
  .feedback .v { font-weight: 700; margin-bottom: 4px; }
  .feedback .v.ok { color: var(--ok); } .feedback .v.bad { color: var(--bad); } .feedback .v.half { color: var(--half); }
  .feedback .ans { color: var(--muted); }
  .feedback .ans + .ans { margin-top: 6px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 140px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .btn.primary { background: var(--accent); color: #2a1218; border-color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .score { font-size: 44px; font-weight: 700; margin: 4px 0; }
  .muted { color: var(--muted); }
  .missed { padding-left: 18px; }
  .missed li { margin-bottom: 8px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"><noscript><h1>Drop phrase quiz</h1><p>Open this file in Safari or Chrome to play.</p></noscript></main>
<script>
// Source: Giusto vault drop phrases (10/2 menu update) with the 10/29 menu replacements applied.
// Each entry: dish name, opener + name as said at the table, and the components after "with".
const DISHES = [
  { dish: "Scup Crudo", open: "This is our", said: "scup crudo", parts: ["satsuma mandarin", "fennel", "calamansi vinegar"] },
  { dish: "Potato Leek Suppli", open: "This is our", said: "potato leek suppli", parts: ["guanciale jam", "chive"] },
  { dish: "Coppa di Testa Crostini", open: "Here is our", said: "coppa di testa crostini", parts: ["kale pesto", "burrata"] },
  { dish: "Roasted Beets", open: "Here is our", said: "beet salad", parts: ["roasted and smoked beets", "blood orange", "whipped ricotta", "pine nuts", "mish mish"] },
  { dish: "Blackbird Farm Beef Spiedini", open: "Here is our", said: "Blackbird Farm beef spiedini", parts: ["beet labneh", "pistachio", "pomegranate mostarda"] },
  { dish: "The Scotch Meatball", open: "This is our", said: "scotch meatball", parts: ["tomato and salumi sauce"] },
  { dish: "Ricotta Frittelle", open: "This is our", said: "ricotta frittelle", parts: ["parmesan", "truffle", "honey"] },
  { dish: "Cappelletti a Fiore", open: "Here is our", said: "cappelletti a fiore", parts: ["Schartner Farms sweet potato", "black truffle", "hazelnut"] },
  { dish: "Sunchoke Mezzaluna", open: "Here is our", said: "sunchoke mezzaluna", parts: ["Sicilian caper", "brown butter", "lemon"] },
  { dish: "Bucatini", open: "Here is our", said: "bucatini", parts: ["scallops", "mussels", "chouriço", "parsnip"] },
  { dish: "Rigatoni", open: "This is our", said: "rigatoni", parts: ["Hopkins Southdowns lamb sausage", "kabocha squash", "kale"] },
  { dish: "Garganelli", open: "Here is our", said: "garganelli", parts: ["Wild Harmony Farm pork ragu", "juniper", "parm"] },
  { dish: "Chicory Salad", open: "Here is our", said: "chicory salad", parts: ["local apple", "blue cheese", "smoked walnut"] },
  { dish: "Calamari Salad", open: "Here is our", said: "calamari salad", parts: ["confit potatoes", "n'duja vinaigrette", "taggiasca olive"] },
  { dish: "Wild Harmony Farm Pork Sausage", open: "Here is our", said: "Wild Harmony Farm pork sausage", parts: ["turnip", "maitake mushroom", "apple cider jus"] },
  { dish: "Short Rib Stracotto", open: "This is our", said: "short rib", parts: ["Thai tomato salsa", "Asian pear", "kohlrabi", "herbs"], pre: "a " },
  { dish: "Wild Harmony Farm Moroccan Spiced Chicken", open: "Here is our", said: "Wild Harmony Farm chicken", parts: ["Tunisian couscous", "Four Town Farm carrots", "pine nuts"] },
  { dish: "Olive Oil Cake", open: "Here is our", said: "olive oil cake", parts: ["Meyer lemon gelato", "blood orange", "pistachio cream"] },
  { dish: "Schartner Farms Sweet Potato Gelato", open: "Here's our", said: "sweet potato gelato", parts: ["Schartner Farms sweet potatoes", "Italian meringue", "brown sugar streusel"] },
  { dish: "Chocolate Tahini Torta", open: "Here is our", said: "chocolate-tahini torta", parts: ["candied kumquat", "espresso mousse"] },
  { dish: "Concord Grape Sorbetto", open: "Here is our", said: "Concord grape sorbet", parts: ["candied cashews"] },
  { dish: "Vanilla Gelato", open: "This is our", said: "vanilla gelato", parts: ["sassafras and huckleberry compote"] },
  { dish: "Milk Chocolate Gelato", open: "This is our", said: "milk chocolate gelato", parts: ["peanut butter fudge"] },
  { dish: "Cornbread Budino", open: "This is our", said: "cornbread budino", parts: ["roasted peach", "caramel popcorn"] },
];

const LEVELS = [
  { id: "easy", name: "Easy", desc: "Name the dish from its phrase" },
  { id: "medium", name: "Medium", desc: "Fill in the missing component" },
  { id: "hard", name: "Hard", desc: "Type every component" },
  { id: "food", name: "Ingredients", desc: "18 questions · prep and components", food: true },
  { id: "allergens", name: "Allergens", desc: "9 questions · allergens and modifications", food: true },
];

// New food questions, from the 10/29 menu descriptions PDF (pp. 1–3).
// Each entry: [dish, question, answer, [wrong answers], explanation].
const FOOD = [
  ['Scup Crudo','Scup is also known as ____.','Porgy',['Fluke','Tuna','Branzino'],'Scup, or porgy, is a mild, delicate white fish served raw.'],
  ['Scup Crudo','The vinaigrette combines calamansi vinegar, Sicilian olive oil and ____.','Colatura di alici',['Miso butter','Balsamic glaze','Harissa'],'Colatura di alici is Italian fish sauce. Satsuma mandarin and seasoned fennel accompany the fish.'],
  ['Roasted Beets','Which three preparations appear in the beet dish?','Salt-roasted, cold-smoked and pickled',['Steamed, grilled and fried','Raw, braised and candied','Pureed, confit and dehydrated'],'Red and candy-stripe beets are salt-roasted; candy-stripe beets are then cold-smoked, and thin red-beet rounds are pickled.'],
  ['Roasted Beets','Which cheese finishes the beets?','Whipped ricotta',['Burrata','Fontina','Great Hill blue cheese'],'Whipped ricotta, pine nuts and mish mish finish beets dressed with calamansi vinaigrette and blood orange.'],
  ['Potato Leek Suppli','The potato-leek risotto is shaped around ____.','Fontina',['Burrata','Mozzarella','Pecorino'],'Potato-leek puree is folded into cooked risotto, chilled overnight and shaped around fontina cheese.'],
  ['Potato Leek Suppli','What coats the suppli before frying?','Instant mashed potato',['Panko breadcrumbs','Cornmeal','Chickpea flour'],'The instant-potato coating surrounds the risotto. Guanciale jam and chive finish the dish.'],
  ['Coppa di Testa Crostini','The housemade salame combines pig-head meat and ground pork with warming spices, garlic and ____.','Orange zest',['Preserved lemon','Fennel pollen','Black truffle'],'The seasoned meat is stuffed into large salame casings and cooked overnight for 12 hours.'],
  ['Coppa di Testa Crostini','Which pesto accompanies the salame and burrata?','Pistachio-kale',['Basil-walnut','Hazelnut-parsley','Sunflower-arugula'],'The pesto contains kale, pistachios, Parmesan, pecorino, olive oil and a touch of serrano chili.'],
  ['Sunchoke Mezzaluna','The sunchoke filling is thickened with ____.','Butter-and-flour roux',['Potato starch alone','Ricotta and egg','Polenta'],'Sunchoke puree is thickened with roux to fill the pasta. Sunchokes are tubers in the sunflower family.'],
  ['Sunchoke Mezzaluna','Which combination anchors the sauce?','Brown butter, lemon and Sicilian capers',['Miso butter, truffle and hazelnuts','Tomato, guanciale and chive','Cream, orange and pistachios'],'The sauce also includes roasted sunchokes, sunflower seeds, Parmesan and parsley.'],
  ['Cappelletti a Fiore','Which vegetables form the filling?','Roasted sweet potato and pumpkin',['Sunchoke and potato','Butternut squash and carrot','Beet and celery root'],'Schartner Farms sweet potatoes and a little pumpkin are roasted, pureed and thickened with roux.'],
  ['Cappelletti a Fiore','What finishes the miso-and-black-truffle pasta?','Shaved Parmesan and toasted hazelnuts',['Pine nuts and ricotta','Pistachios and burrata','Sunflower seeds and pecorino'],'The sauce combines miso, black truffle, butter, Parmesan and lemon; shaved Parmesan and chopped toasted hazelnuts finish it.'],
  ['Moroccan Spiced Chicken','How are the two chicken portions cooked?','Pan-seared half breast and braised half leg',['Both portions deep-fried','Roasted breast and grilled leg','Poached breast and smoked leg'],'Half a breast is pan-seared; half a leg is braised in a tomato-based vegetable stew with Tangier spice.'],
  ['Moroccan Spiced Chicken','Tangier spice combines cinnamon, cumin, cardamom and ____.','Rose petals',['Saffron','Fennel pollen','Star anise'],'The chicken is served over hand-rolled Tunisian couscous with harissa-dressed carrots and preserved lemon, among other garnishes.'],
  ['Sweet Potato Gelato','How are the sweet potatoes prepared for the base?','Roasted whole, then cooked with milk',['Boiled, then folded into yogurt','Raw, then blended with cream','Steamed, then mixed with egg custard'],'Whole roasting concentrates the sweet-potato flavor. Balanced starches keep the gelato creamy when frozen.'],
  ['Sweet Potato Gelato','Which toppings evoke sweet potato casserole?','Italian meringue and brown-sugar streusel',['Whipped cream and candied cashews','Pistachio cream and citrus','Chocolate sauce and cookie crumbs'],'Italian meringue and brown-sugar streusel turn sweet potato casserole flavors into dessert.'],
  ['Olive Oil Cake','Which gelato accompanies the current cake?','Meyer lemon',['Parmesan','Vanilla','Sweet potato'],'The current cake comes with Meyer lemon gelato, blood orange, mandarin and Sicilian pistachio cream.'],
  ['Olive Oil Cake','The pistachio cream combines pureed pistachios with ____.','White chocolate',['Mascarpone','Dark chocolate','Tahini'],'The pistachio-white-chocolate cream has a custard-like mouthfeel; vanilla notes connect the dish’s components.']
];
const ALLERGENS = [
  ['Scup Crudo','Which allergen is explicitly listed for Scup Crudo?','Finfish',['Dairy','Egg','Peanut'],'The source lists finfish. This is not a complete free-of list for other allergens.'],
  ['Roasted Beets','Which listed allergens have documented removal options?','Dairy and tree nuts',['Gluten and egg','Soy and sesame','Finfish and shellfish'],'The source allows removing dairy and tree nuts. Kitchen confirmation and cross-contact handling still apply.'],
  ['Potato Leek Suppli','What is the documented gluten concern?','Shared-fryer cross-contact',['Wheat-flour breading','Wheat risotto','Soy sauce in the filling'],'The coating is instant mashed potato, but the shared fryer creates gluten cross-contact. Dairy and allium are also listed.'],
  ['Coppa di Testa Crostini','Which removal is explicitly documented?','Dairy can be removed',['Pistachios can be removed','Gluten can be removed','Every listed allergen can be removed'],'Page 2 says dairy can be removed but is not recommended; gluten cannot be modified. Pistachios appear in the pesto ingredients on page 1, but their removal is not specified.'],
  ['Sunchoke Mezzaluna','Which two allergens are explicitly listed?','Gluten and dairy',['Egg and soy','Tree nuts and sesame','Finfish and shellfish'],'Page 2 lists “Gluten, Dairy (cannot be modified)” and describes a butter-and-flour roux. No egg status or gluten-removal preparation is specified; do not infer either.'],
  ['Cappelletti a Fiore','Which listed allergens are nonremovable?','Gluten, dairy and egg',['Tree nuts and soy','Dairy and tree nuts only','Gluten and soy only'],'Gluten, dairy and egg cannot be removed. The memo lists tree nuts and soy as removable.'],
  ['Moroccan Spiced Chicken','Which ingredient explains the documented gluten?','Durum-wheat couscous',['Pine nuts','Currants','Preserved lemon'],'The couscous contains durum wheat. The source permits gluten and pine-nut removal; ask the kitchen for the exact preparation.'],
  ['Sweet Potato Gelato','The base is egg-free. Which component contains egg?','Italian meringue',['The roasted sweet potato','The milk','The base itself'],'The meringue contains egg and must be removed for the documented egg-removal modification. Dairy is nonremovable.'],
  ['Olive Oil Cake','Which listed allergen can be removed?','Pistachios / tree nuts',['Dairy','Gluten','Egg'],'Pistachios can be removed. Dairy, gluten and egg are nonremovable in this version.']
];
const poolFor = (id) => id === "food" ? FOOD : id === "allergens" ? ALLERGENS : DISHES;
const PASS = 0.8;
const STORE = "giusto-drop-quiz-v1";

const listJoin = (items) => items.length < 2 ? items.join("")
  : items.length === 2 ? `${items[0]} and ${items[1]}`
  : `${items.slice(0, -1).join(", ")}, and ${items[items.length - 1]}`;
const phraseOf = (d) => `${d.open} ${d.said} with ${d.pre || ""}${listJoin(d.parts)}`;
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);

const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9 ]+/g, " ").replace(/\b(the|a|an|and|with|our)\b/g, " ").replace(/s\b/g, "").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= n; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[n];
}
const ALIASES = { "chouriço": ["chorizo"], "parm": ["parmesan"], "mish mish": ["mishmish"] };
const near = (a, b) => a.length > 0 && lev(a, b) <= Math.max(1, Math.floor(b.length * 0.2));
const close = (typed, part) => [part, ...(ALIASES[part] || [])].some((p) => near(norm(typed), norm(p)));

// A component that starts with a farm name also matches without it, for half credit.
const FARMS = ["Schartner Farms", "Hopkins Southdowns", "Wild Harmony Farm", "Four Town Farm"];
const withoutFarm = (part) => { const f = FARMS.find((x) => part.startsWith(x + " ")); return f ? part.slice(f.length + 1) : null; };

// Grade typed slots against parts in any order. Each slot is "full", "half" (farm name left out) or false.
// Full matches are taken first so a farm-less answer cannot claim a part another slot names in full.
function gradeSlots(typed, parts) {
  const left = parts.slice(), ok = typed.map(() => false), farmNotes = [];
  typed.forEach((t, j) => { const i = left.findIndex((p) => close(t, p)); if (i >= 0) { ok[j] = "full"; left.splice(i, 1); } });
  typed.forEach((t, j) => {
    if (ok[j]) return;
    const i = left.findIndex((p) => withoutFarm(p) && close(t, withoutFarm(p)));
    if (i >= 0) { ok[j] = "half"; farmNotes.push(left[i]); left.splice(i, 1); }
  });
  return { ok, missing: left, farmNotes };
}

// Previews and sandboxed viewers can block localStorage; progress then lasts for the session only.
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} };

function buildQuestions(levelId, pool) {
  return shuffle(pool).map((d) => {
    if (levelId === "food" || levelId === "allergens") return { fact: d, kind: "mc", options: shuffle([d[2], ...d[3]]), answer: d[2] };
    if (levelId === "easy") {
      const others = pick(DISHES.filter((x) => x !== d), 3).map((x) => x.dish);
      return { d, kind: "mc", options: shuffle([d.dish, ...others]), answer: d.dish };
    }
    if (levelId === "medium") {
      const idx = Math.floor(Math.random() * d.parts.length);
      const answer = d.parts[idx];
      const others = pick([...new Set(DISHES.filter((x) => x !== d).flatMap((x) => x.parts))].filter((p) => !d.parts.some((x) => norm(x) === norm(p))), 3);
      return { d, kind: "mc", idx, options: shuffle([answer, ...others]), answer };
    }
    return { d, kind: "type" };
  });
}

let run = null;
const app = document.getElementById("app");
const head = (right) => `<header><b>Giusto</b><span>${right}</span></header>`;

function home() {
  run = null;
  const card = (l, i) => {
    const best = state[l.id];
    const badge = best != null ? `<span class="badge ${best >= PASS ? "pass" : ""}">Best ${Math.round(best * 100)}%</span>` : "";
    return `<button class="level" data-level="${i}">
        <span><strong>${l.food ? "" : `${i + 1}. `}${l.name}</strong><small>${l.desc}</small></span>${badge}</button>`;
  };
  app.innerHTML = `${head("")}
    <h1>Drop phrases</h1>
    <div class="levels">${LEVELS.slice(0, 3).map(card).join("")}</div>
    <details><summary>All phrases</summary><ul>${DISHES.map((d) =>
      `<li><b>${esc(d.dish)}</b><br>${esc(phraseOf(d))}</li>`).join("")}</ul></details>
    <h2>New food</h2>
    <div class="levels">${LEVELS.slice(3).map((l, i) => card(l, i + 3)).join("")}</div>
    ${Object.keys(state).length ? `<p><button class="link" id="reset">Reset progress</button></p>` : ""}`;
  app.querySelectorAll(".level").forEach((b) => b.onclick = () => start(+b.dataset.level, poolFor(LEVELS[+b.dataset.level].id)));
  const r = document.getElementById("reset");
  if (r) r.onclick = () => { if (confirm("Reset all progress?")) { for (const k in state) delete state[k]; save(); home(); } };
  app.querySelector(".level").focus();
}

function start(levelIdx, pool) {
  const level = LEVELS[levelIdx];
  run = { levelIdx, level, qs: buildQuestions(level.id, pool), i: 0, right: 0, missed: [], answered: false, full: pool.length === poolFor(level.id).length };
  question();
}

function question() {
  const { level, qs, i } = run, q = qs[i], d = q.d;
  run.answered = false;
  let body;
  if (q.fact) {
    body = `<div class="q"><div class="label">${esc(q.fact[0])}</div><div class="phrase">${esc(q.fact[1])}</div></div>`;
  } else if (level.id === "easy") {
    body = `<div class="q"><div class="label">Which dish?</div>
      <div class="phrase">${esc(d.open)} <span class="blank">?</span> with ${esc(d.pre || "")}${esc(listJoin(d.parts))}</div></div>`;
  } else if (level.id === "medium") {
    const parts = d.parts.map((p, j) => j === q.idx ? `<span class="blank">?</span>` : esc(p));
    body = `<div class="q"><div class="label">${esc(d.dish)}</div>
      <div class="phrase">${esc(d.open)} ${esc(d.said)} with ${esc(d.pre || "")}${listJoin(parts)}</div></div>`;
  } else {
    body = `<div class="q"><div class="label">${d.parts.length} component${d.parts.length > 1 ? "s" : ""}, any order</div>
      <div class="dish">${esc(d.dish)}</div></div>
      <form id="typed" class="slots" autocomplete="off">${d.parts.map((_, j) =>
        `<input class="slot" aria-label="Component ${j + 1}" placeholder="Component ${j + 1}" autocapitalize="off" spellcheck="false">`).join("")}
        <div class="actions"><button class="btn primary" type="submit">Check</button></div></form>`;
  }
  const choices = q.kind === "mc" ? `<div class="choices">${q.options.map((o, j) =>
    `<button class="choice" data-o="${esc(o)}"><kbd>${j + 1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>` : "";
  app.innerHTML = `${head(`${level.name} · ${i + 1} / ${qs.length}`)}
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${qs.length}" aria-valuenow="${i}"><i style="width:${(i / qs.length) * 100}%"></i></div>
    ${body}${choices}<div id="after"></div>
    ${level.id === "allergens" ? `<p class="muted">Practice, not allergy clearance. Follow the kitchen’s allergy procedure.</p>` : ""}
    <p><button class="link" id="quit">Quit to levels</button></p>`;
  document.getElementById("quit").onclick = home;
  if (q.kind === "mc") {
    app.querySelectorAll(".choice").forEach((b) => b.onclick = () => answerMc(b));
    app.querySelector(".choice").focus();
  } else {
    const form = document.getElementById("typed");
    form.onsubmit = (e) => { e.preventDefault(); answerTyped(form); };
    form.querySelector(".slot").focus();
  }
}

function answerMc(btn) {
  if (run.answered) return;
  const q = run.qs[run.i], ok = btn.dataset.o === q.answer;
  app.querySelectorAll(".choice").forEach((b) => {
    b.disabled = true;
    if (b.dataset.o === q.answer) b.classList.add("ok"); else if (b === btn) b.classList.add("bad");
  });
  feedback(ok ? 1 : 0);
}

function answerTyped(form) {
  if (run.answered) return;
  const q = run.qs[run.i], inputs = [...form.querySelectorAll(".slot")];
  const { ok, missing, farmNotes } = gradeSlots(inputs.map((x) => x.value), q.d.parts);
  inputs.forEach((x, j) => { x.readOnly = true; x.classList.add(ok[j] === "full" ? "ok" : ok[j] === "half" ? "half" : "bad"); });
  form.querySelector(".actions").remove();
  const score = missing.length ? 0 : farmNotes.length ? 0.5 : 1;
  const notes = [missing.length ? `Missed: ${missing.join(", ")}` : "", farmNotes.length ? `Add the farm: ${farmNotes.join(", ")}` : ""];
  feedback(score, notes.filter(Boolean).join("\n"));
}

// score: 1 correct, 0.5 half correct (farm name left out), 0 incorrect.
function feedback(score, extra = "") {
  run.answered = true;
  const q = run.qs[run.i];
  run.right += score;
  if (score < 1) run.missed.push(q.fact || q.d);
  const [cls, verdict] = score === 1 ? ["ok", "Correct"] : score ? ["half", "Half correct"] : ["bad", "Incorrect"];
  const last = run.i === run.qs.length - 1;
  document.getElementById("after").innerHTML = `<div class="feedback">
      <div class="v ${cls}">${verdict}</div>
      ${extra.split("\n").filter(Boolean).map((t) => `<div class="ans">${esc(t)}</div>`).join("")}
      <div class="ans">${q.fact ? esc(q.fact[4]) : `“${esc(phraseOf(q.d))}”`}</div></div>
    <div class="actions"><button class="btn primary" id="next">${last ? "See results" : "Next"}</button></div>`;
  const next = document.getElementById("next");
  next.onclick = () => { if (last) results(); else { run.i++; question(); } };
  next.focus();
}

function results() {
  const { levelIdx, level, qs, right, missed, full } = run;
  const pct = right / qs.length;
  if (full) { state[level.id] = Math.max(state[level.id] || 0, pct); save(); }
  const nextLevel = levelIdx < 2 ? LEVELS[levelIdx + 1] : null; // Easy → Medium → Hard
  const canNext = !!nextLevel;
  const note = full ? "" : "Missed-only round.";
  app.innerHTML = `${head(level.name)}
    <div class="q"><div class="label">Score</div><div class="score">${Math.round(pct * 100)}%</div>
      <div class="muted">${right} / ${qs.length}${note ? ` · ${note}` : ""}</div></div>
    ${missed.length ? `<div class="q"><div class="label">Review</div><ul class="missed">${missed.map((d) => Array.isArray(d)
      ? `<li><b>${esc(d[0])}</b> · ${esc(d[1])}<br><span class="muted">${esc(d[2])}. ${esc(d[4])}</span></li>`
      : `<li><b>${esc(d.dish)}</b><br><span class="muted">${esc(phraseOf(d))}</span></li>`).join("")}</ul></div>` : ""}
    <div class="actions">
      ${missed.length ? `<button class="btn" id="retry">Retry missed</button>` : ""}
      ${canNext ? `<button class="btn primary" id="next">Start ${nextLevel.name}</button>` : `<button class="btn primary" id="again">New round</button>`}
    </div>
    <p><button class="link" id="home">Levels</button></p>`;
  document.getElementById("home").onclick = home;
  document.getElementById("retry")?.addEventListener("click", () => start(levelIdx, missed));
  document.getElementById("next")?.addEventListener("click", () => start(levelIdx + 1, DISHES));
  document.getElementById("again")?.addEventListener("click", () => start(levelIdx, poolFor(level.id)));
  (document.getElementById("next") || document.getElementById("again")).focus();
}

document.addEventListener("keydown", (e) => {
  if (!run || run.answered || e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  const btns = app.querySelectorAll(".choice");
  if (n >= 1 && n <= btns.length) btns[n - 1].click();
});

home();
</script>
</body>
</html>
